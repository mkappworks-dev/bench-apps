<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevBench — DB connections, query runner, grid redesign</title>
<style>
  /* Tokens copied verbatim from devbench-v2-shell.html / DESIGN.md so this
     reads as the same app, not a different visual language. */
  :root {
    --bg: #08090c; --surface: #121419; --surface-2: #191c22; --border: #24262e;
    --text: #ecedf2; --text-muted: #999fac; --text-faint: #666d7a;
    --accent: #f2f3f5; --accent-strong: #ffffff; --accent-on: #0a0b0e;
    --page-glow: rgba(255, 255, 255, 0.07);
    --success: #3fce85; --success-bg: #12271c;
    --warning: #e3a438; --warning-bg: #2b2210;
    --danger: #e5695f; --danger-bg: #2b1514;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    --glass-bg: rgba(18,20,25,.72); --glass-border: rgba(255,255,255,.08);
    --glass-hi: inset 0 1px 0 rgba(255,255,255,.06);
    --radius-sm: 6px; --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --fs-xs: 10.5px; --fs-sm: 12px; --fs-md: 13.5px; --fs-h: 16px;
  }
  :root[data-theme="light"] {
    --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6; --border:#dde3ec;
    --text:#10151f; --text-muted:#5b6472; --text-faint:#8a92a1;
    --accent:#10151f; --accent-strong:#000000; --accent-on:#ffffff;
    --page-glow: rgba(16,21,31,.025);
    --success:#167a45; --success-bg:#e3f5eb; --warning:#a3660a; --warning-bg:#faf0dc;
    --danger:#b93a3a; --danger-bg:#fbe9e9;
    --shadow:0 1px 2px rgba(16,21,31,.05), 0 10px 28px rgba(16,21,31,.09);
    --glass-bg: rgba(255,255,255,.78); --glass-border: rgba(16,21,31,.07);
    --glass-hi: inset 0 1px 0 rgba(255,255,255,.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font-sans); font-size: var(--fs-md); line-height: 1.5;
    background: radial-gradient(1000px 520px at 8% -12%, var(--page-glow), transparent 60%), var(--bg);
    color: var(--text); -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  svg { display: block; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 560px; }

  .strip { display: grid; grid-template-columns: 218px 1fr auto; height: 44px; min-height: 44px; border-bottom: 1px solid var(--border); -webkit-app-region: drag; position: relative; }
  .strip button, .strip .tab { -webkit-app-region: no-drag; }
  .strip-col { display: flex; align-items: center; min-width: 0; }
  .tabs-col { padding: 0 0 0 8px; }
  .actions-col { justify-content: flex-end; gap: 2px; padding: 0 10px; }
  .lights { display: flex; gap: 8px; align-items: center; padding: 0 0 0 14px; }
  .light { width: 12px; height: 12px; border-radius: 50%; }
  .light.r { background: #ff5f57; } .light.y { background: #febc2e; } .light.g { background: #28c840; }

  .tabs { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .tab { appearance: none; border: 1px solid transparent; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px 0 9px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--fs-sm); font-weight: 500; }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .tab .sub { color: var(--text-faint); font-family: var(--font-mono); font-size: var(--fs-sm); }
  .tab[aria-selected="true"] .sub { color: var(--text-muted); }

  .ghost-btn { appearance: none; border: 1px solid transparent; background: transparent; cursor: pointer; height: 30px; padding: 0 9px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: var(--fs-sm); font-weight: 500; }
  .ghost-btn:hover { background: var(--surface-2); color: var(--text); }
  .ghost-btn.icon-only { width: 26px; height: 26px; padding: 0; justify-content: center; }
  .divider { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

  /* Popup primitive — same shape as the v2 shell's `.menu` */
  .menu { position: absolute; z-index: 50; min-width: 220px; padding: 5px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--shadow), var(--glass-hi); backdrop-filter: blur(22px) saturate(155%); -webkit-backdrop-filter: blur(22px) saturate(155%); }
  .menu-label { padding: 6px 9px 5px; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); }
  .menu-item { appearance: none; width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--fs-md); }
  .menu-item:hover, .menu-item.hi { background: var(--surface-2); color: var(--text); }
  .menu-item .desc { display: block; font-size: var(--fs-sm); color: var(--text-faint); font-weight: 400; }
  .menu-item strong { font-weight: 600; font-size: var(--fs-md); }
  .menu-item .k { margin-left: auto; color: var(--text-faint); }
  .menu-sep { height: 1px; background: var(--border); margin: 5px 3px; }
  .scrim { position: fixed; inset: 0; z-index: 40; }

  .select-trigger { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); padding: 0 8px 0 11px; height: 30px; color: var(--text); font-size: var(--fs-sm); font-weight: 600; }
  .select-trigger:hover { border-color: var(--text-faint); background: var(--surface-2); }
  .select-trigger .chev { color: var(--text-faint); margin-left: auto; }

  .body-grid { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 218px; min-width: 218px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .side-head { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-faint); }
  .side-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .side-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-muted); font-size: var(--fs-sm); border: 0; background: transparent; width: 100%; text-align: left; }
  .side-item:hover { background: var(--surface-2); }
  .side-item[aria-current="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
  .side-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot { border-top: 1px solid var(--border); padding: 6px; }

  .panes { flex: 1; display: flex; min-width: 0; }
  .pane { flex: 1; min-width: 0; display: flex; }

  .card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
  .card-head { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-faint); display: flex; align-items: center; gap: 8px; }
  .pill { font-size: var(--fs-xs); font-weight: 700; padding: 2px 7px; border-radius: 20px; font-family: var(--font-mono); }
  .pill.ok { background: var(--success-bg); color: var(--success); }
  .pill.warn { background: var(--warning-bg); color: var(--warning); }
  .pill.err { background: var(--danger-bg); color: var(--danger); }
  .pill.muted { background: var(--surface-2); color: var(--text-faint); }

  .field { height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 0 11px; display: flex; align-items: center; font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text); }
  input.field, select.field, textarea.field { width: 100%; outline: none; }
  textarea.field { padding: 9px 11px; height: auto; min-height: 74px; resize: vertical; line-height: 1.6; }
  .primary { appearance: none; border: 0; cursor: pointer; height: 34px; padding: 0 16px; border-radius: var(--radius-sm); background: var(--accent); color: var(--accent-on); font-size: var(--fs-md); font-weight: 700; }
  .primary:hover { background: var(--accent-strong); }

  .tree-item { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-muted); border: 0; background: transparent; width: 100%; text-align: left; }
  .tree-item:hover { background: var(--surface-2); }
  .tree-item[aria-current="true"] { background: var(--surface-2); color: var(--text); }
  .tree-item .eye { margin-left: auto; color: var(--text-faint); }
  .tree-item.watched .eye { color: var(--success); }

  .settings { flex: 1; display: flex; min-height: 0; }
  .settings-nav { width: 190px; min-width: 190px; border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  .settings-body { flex: 1; overflow-y: auto; padding: 26px 32px; }
  .settings-body .inner { max-width: 680px; }

  .empty { display: grid; place-items: center; height: 100%; text-align: center; color: var(--text-faint); }

  /* ===================== new for this mockup ===================== */

  /* DB tab left rail: connection picker replaces the plain "devbench_test" label */
  .rail { width: 210px; min-width: 210px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  /* 44px, the same as .pane-strip and .side-head, so the shell's first
     horizontal rule is one unbroken line across every column instead of
     stepping 1-2px at each boundary. */
  .rail-head { height: 44px; display: flex; align-items: center; padding: 0 8px; border-bottom: 1px solid var(--border); }
  .rail-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }

  .db-content { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .pane-strip { display: flex; align-items: center; gap: 8px; height: 44px; min-height: 44px; padding: 0 14px; border-bottom: 1px solid var(--border); }

  .db-body { flex: 1; overflow: auto; padding: 16px 18px; min-height: 0; }

  /* Query console — a resizable bottom drawer, not a mode swap. Browse stays
     visible above it at all times, so you can watch a table while querying
     another one (or the same one). */
  .query-drawer { display: flex; flex-direction: column; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--surface); }
  /* Full-width hit zone for easy grabbing, but the visible grip is a small
     centered pill — the drag affordance reads as "top middle", not a bar
     spanning the whole panel. */
  .drawer-handle { height: 14px; cursor: row-resize; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .drawer-handle::after { content: ''; width: 36px; height: 4px; border-radius: 2px; background: var(--border); transition: background-color 150ms ease; }
  .drawer-handle:hover::after, .drawer-handle.dragging::after { background: var(--text-faint); }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .drawer-body { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .sql-meta { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-faint); }
  .sql-meta b { color: var(--text); font-family: var(--font-mono); }

  /* Grid */
  .grid-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }

  /* Filter narrows the rows already fetched — it is not a WHERE clause, so it
     says "this page" rather than implying it searched the whole table. */
  .grid-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .grid-toolbar input { flex: 1; min-width: 0; height: 26px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); padding: 0 8px; font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text); outline: none; }
  .grid-toolbar input::placeholder { color: var(--text-faint); }
  .grid-toolbar .count { flex-shrink: 0; font-size: var(--fs-sm); color: var(--text-faint); }
  .grid-toolbar .reset { flex-shrink: 0; appearance: none; border: 0; background: transparent; cursor: pointer; border-radius: var(--radius-sm); padding: 2px 8px; font-size: var(--fs-sm); color: var(--text-faint); }
  .grid-toolbar .reset:hover { background: var(--surface-2); color: var(--text); }

  /* `separate` rather than `collapse`: a collapsed border belongs to the table,
     not the cell, so it does not travel with a position:sticky frozen column.
     With 0 spacing and borders only on the right/bottom edges the result is
     visually identical to the collapsed grid. */
  table.data { width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--font-mono); font-size: var(--fs-sm); }
  table.data th { position: relative; text-align: left; padding: 0; color: var(--text-faint); font-weight: 600; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--surface-2); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; user-select: none; }
  table.data th:last-child, table.data td:last-child { border-right: 0; }
  .th-inner { display: flex; align-items: center; }
  .th-btn { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; padding: 7px 4px 7px 12px; background: transparent; border: 0; cursor: pointer; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; text-align: left; }
  .th-btn:hover { color: var(--text); }
  .th-btn .chev { opacity: 0; color: var(--text-faint); }
  th[data-sort]:not([data-sort="none"]) .chev, .th-btn:hover .chev { opacity: 1; }
  th[data-sort="desc"] .chev { transform: rotate(180deg); }
  /* Which term ties first when several columns are sorted at once. */
  .th-btn .ord { color: var(--text-faint); font-variant-numeric: tabular-nums; }
  /* `visibility` rather than opacity so an unrevealed pin cannot be clicked,
     while the header still reserves its space and nothing shifts on hover. */
  .th-pin { display: flex; flex-shrink: 0; margin-right: 10px; padding: 2px; border: 0; background: transparent; cursor: pointer; color: var(--text-faint); visibility: hidden; }
  th:hover .th-pin { visibility: visible; }
  .th-pin:hover { color: var(--text); }
  .th-pin.on { visibility: visible; color: var(--text); }
  /* A frozen column slides over its neighbours, so it carries its own opaque
     fill — including the row hover fill, or hovering would punch a hole in it. */
  /* `table.data th` above is (0,1,2) and sets position:relative, so the frozen
     header needs at least that weight to win — a bare `th.pinned` loses. */
  table.data th.pinned, table.data td.pinned { position: sticky; z-index: 2; }
  table.data th.pinned { background: var(--surface-2); }
  table.data td.pinned { background: var(--bg); }
  table.data tr:hover td.pinned { background: var(--surface-2); }
  th[draggable="true"] { cursor: grab; }
  th.dragging { opacity: .5; }
  .th-resize { position: absolute; top: 0; right: 0; bottom: 0; width: 5px; cursor: col-resize; }
  .th-resize:hover { background: var(--accent); opacity: .5; }
  /* Column rules as well as row rules: with a dozen columns scrolling
     horizontally, a vertical hairline is what keeps a value tied to its
     header. Same --border weight as the row rule so the grid reads as one
     structure rather than two competing ones. */
  table.data td { padding: 7px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); color: var(--text-muted); white-space: nowrap; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data tr:hover td { background: var(--surface-2); }
  .cell-num { text-align: right; font-variant-numeric: tabular-nums; }
  .cell-null { color: var(--text-faint); font-style: italic; }
  .cell-unsupported { color: var(--warning); font-style: italic; }
  .cell-bool { display: inline-flex; padding: 1px 7px; border-radius: 20px; font-size: var(--fs-xs); font-weight: 700; }
  .cell-bool.t { background: var(--success-bg); color: var(--success); }
  .cell-bool.f { background: var(--surface); border: 1px solid var(--border); color: var(--text-faint); }
  td.editable:hover { background: var(--surface-2); cursor: text; }
  td.editable:hover::after { content: '✎'; float: right; color: var(--text-faint); font-size: var(--fs-xs); }
  /* The editor sizes to its value and floats over the columns to its right —
     a cell is usually far narrower than what it holds. Absolute against the
     cell so nothing reflows and the header stays aligned; opaque because it is
     genuinely covering the cells underneath. Below the sticky header (z-3),
     above ordinary cells. */
  td { position: relative; }
  .cell-edit, .cell-diff-inline { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 3; display: flex; align-items: center; gap: 4px; width: max-content; min-width: 100%; padding: 4px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); box-shadow: var(--shadow); }
  .cell-edit input { min-width: 0; background: var(--bg); border: 1px solid var(--accent); border-radius: 4px; padding: 3px 6px; color: var(--text); font: inherit; }
  .cell-edit button, .cell-diff-inline button { appearance: none; border: 0; cursor: pointer; width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; flex-shrink: 0; }
  .cell-edit .save, .cell-diff-inline .save { background: var(--success-bg); color: var(--success); }
  .cell-edit .cancel, .cell-diff-inline .cancel { background: var(--surface-2); color: var(--text-faint); }
  .cell-diff-old { color: var(--danger); text-decoration: line-through; }
  .cell-diff-new { color: var(--success); font-weight: 600; }
  .diff-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface); }
  .diff-card .head { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-faint); margin-bottom: 6px; }
  .diff-row { display: flex; gap: 10px; align-items: center; font-family: var(--font-mono); font-size: var(--fs-sm); padding: 3px 0; }
  .diff-row .col { color: var(--text-faint); min-width: 70px; }

  .grid-pager { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--surface); font-size: var(--fs-sm); color: var(--text-faint); }
  .grid-pager .btns { display: flex; gap: 6px; }
  .grid-note { margin-top: 10px; font-size: var(--fs-sm); color: var(--text-faint); }

  /* Settings > Connections */
  .conn-list { display: flex; flex-direction: column; gap: 8px; margin: 18px 0; }
  .conn-card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .conn-card .name { font-weight: 600; font-size: var(--fs-md); }
  .conn-card .meta { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-faint); }
  .conn-card .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .form-grid .span-2 { grid-column: 1 / -1; }
  .form-label { display: block; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 5px; }
  .form-help { font-size: var(--fs-sm); color: var(--text-faint); margin-top: 10px; }

  /* Add/edit connection modal. Glass, matching the New Session picker
     precedent for transient overlays (SettingsScreen.tsx's own comment notes
     Settings itself is ghosty because it's persistent — a modal is not). */
  .modal-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .modal { width: 560px; max-width: calc(100vw - 40px); max-height: calc(100vh - 80px); overflow-y: auto; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--shadow), var(--glass-hi); backdrop-filter: blur(22px) saturate(155%); -webkit-backdrop-filter: blur(22px) saturate(155%); }
  @media (prefers-reduced-transparency: reduce) { .modal { background: var(--surface); backdrop-filter: none; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: var(--fs-md); font-weight: 700; }
  .modal-body { padding: 18px 16px; }
  .modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div id="root" class="app"></div>

<script>
const I = {
  chev: '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  x: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',

/* On-screen column order: the saved order for this table, minus columns it no
   longer has, plus any it gained — then pinned columns hoisted to the front so
   "pinned" and "leftmost" cannot disagree. */
function visualCols(table) {
  const cols = SCHEMAS[table].cols;
  const saved = (S.colOrder[table] || []).filter(c => cols.includes(c));
  const ordered = [...saved, ...cols.filter(c => !saved.includes(c))];
  return [...ordered.filter(c => S.pinned.includes(c)), ...ordered.filter(c => !S.pinned.includes(c))];
}

/* Rows keep their original index so an edit still resolves against the row the
   user clicked, not its position in the filtered view. */
function visibleRows(table) {
  const indexed = ROWS[table].map((row, index) => ({ row, index }));
  const needle = S.filter.trim().toLowerCase();
  if (!needle) return indexed;
  return indexed.filter(({ row }) => row.some(v => displayValue(v).toLowerCase().includes(needle)));
}

function browseBody() {
  const schema = SCHEMAS[S.activeTable];
  const shown = visibleRows(S.activeTable);
  const total = ROWS[S.activeTable].length;
  const customised = S.pinned.length > 0 || (S.colOrder[S.activeTable] || []).length > 0;
  return `
    <div class="grid-wrap">
      <div class="grid-toolbar">
        <input id="grid-filter" placeholder="Filter this page…" value="${S.filter}" spellcheck="false" />
        ${S.filter.trim() ? `<span class="count">${shown.length} of ${total}</span>` : ''}
        ${customised ? '<button class="reset" data-act="reset-layout">Reset layout</button>' : ''}
      </div>
      ${grid(visualCols(S.activeTable), shown, schema.pk)}
      <div class="grid-pager">
        <span>Showing 1–${shown.length} · ${S.activeTable}</span>
        <div class="btns">
          <button class="ghost-btn" disabled style="opacity:.4">Prev</button>
          <button class="ghost-btn">Next</button>
        </div>
      </div>
    </div>
    ${schema.pk ? '' : `<div class="grid-note">No single-column primary key on <b style="color:var(--text-muted)">${S.activeTable}</b> — cells are read-only (same rule correlation watching already uses).</div>`}
  `;
}

/* Query console: a resizable bottom drawer, not a mode swap — Browse (above)
   keeps rendering the currently selected table the whole time. */
function queryDrawer() {
  const ex = QUERY_EXAMPLES[S.queryExample];
  return `<div class="query-drawer" style="height:${S.drawerHeight}px">
    <div class="drawer-handle" title="Drag to resize"></div>
    <div class="drawer-head">
      <span style="font-size:var(--fs-xs);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint)">Query console</span>
      <span style="font-size:var(--fs-xs);color:var(--text-faint)">— single statement per run, against ${activeConnection().name}</span>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <button class="ghost-btn" data-act="ex-select" aria-pressed="${S.queryExample === 'select'}" style="height:24px;font-size:var(--fs-xs)">Example: SELECT</button>
        <button class="ghost-btn" data-act="ex-update" aria-pressed="${S.queryExample === 'update'}" style="height:24px;font-size:var(--fs-xs)">Example: UPDATE</button>
        <button class="primary" data-act="run-query" style="height:26px;padding:0 12px;font-size:var(--fs-sm)">Preview ⌘⏎</button>
        <button class="ghost-btn icon-only" data-act="toggle-console" aria-label="Close console">${I.x}</button>
      </div>
    </div>
    <div class="drawer-body">
      <textarea class="field" style="min-height:56px" spellcheck="false">${ex.sql}</textarea>
      ${renderQueryPhase(ex)}
    </div>
  </div>`;
}

function renderQueryPhase(ex) {
  if (S.queryPhase === 'idle') {
    return `<div class="grid-note" style="margin-top:0">Press Preview — this opens a transaction and shows you the effect. Nothing is permanent in ${activeConnection().name} until you Commit.</div>`;
  }
  if (S.queryPhase === 'preview') {
    return `
      <div class="sql-meta"><span class="pill muted">PREVIEW</span><span>held in an open transaction — not yet committed</span></div>
      ${ex.diff ? ex.diff.map(diffCard).join('') : (ex.columns.length ? `<div class="grid-wrap">${grid(ex.columns, ex.rows.map((row, index) => ({ row, index })), null)}</div>` : `<div class="grid-note" style="margin-top:0">No rows matched.</div>`)}
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="ghost-btn" data-act="rollback-query" style="border:1px solid var(--border)">Rollback</button>
        <button class="primary" data-act="commit-query">Commit</button>
      </div>
    `;
  }
  // committed
  return `
    <div class="sql-meta">
      <span class="pill ok">✓ COMMITTED</span>
      ${'rowsAffected' in ex ? `<span><b>${ex.rowsAffected}</b> row affected</span>` : `<span><b>${ex.rows.length}</b> rows</span>`}
      <span>·</span><span>${ex.meta.split('·')[1] || ''}</span>
    </div>
    ${!('rowsAffected' in ex) && ex.columns.length ? `<div class="grid-wrap">${grid(ex.columns, ex.rows.map((row, index) => ({ row, index })), null)}</div>` : ''}
  `;
}

function diffCard(d) {
  return `<div class="diff-card">
    <div class="head">${d.table} · ${d.match}</div>
    ${d.changes.map(c => `<div class="diff-row"><span class="col">${c.col}</span><span class="cell-diff-old">${c.before}</span><span style="color:var(--text-faint)">→</span><span class="cell-diff-new">${c.after}</span></div>`).join('')}
  </div>`;
}

/* `cols` is the on-screen order; `dataCols` is the order the row arrays are
   indexed by. Every cell resolves its value (and its edit target) through the
   DATA index, so reordering can never redirect an edit to another column. */
function grid(cols, rows, pkCol, dataCols) {
  const data = dataCols || cols;
  let pinLeft = 0;
  const offsets = {};
  for (const c of cols) {
    if (!S.pinned.includes(c)) break;
    offsets[c] = pinLeft;
    pinLeft += 140;
  }
  const th = (c) => {
    const term = S.sort.find(t => t.col === c);
    const ord = S.sort.length > 1 && term ? `<span class="ord">${S.sort.indexOf(term) + 1}</span>` : '';
    const pinned = S.pinned.includes(c);
    const style = pinned ? ` style="left:${offsets[c]}px"` : '';
    return `<th data-sort="${term ? (term.desc ? 'desc' : 'asc') : 'none'}" data-col="${c}" draggable="true"
                class="${pinned ? 'pinned' : ''} ${S.dragCol === c ? 'dragging' : ''}"${style}>
      <div class="th-inner">
        <button class="th-btn" data-sort-col="${c}" title="Click to sort, shift-click to add a sort, drag to reorder">${c}${I.chev}${ord}</button>
        <button class="th-pin ${pinned ? 'on' : ''}" data-pin-col="${c}" title="${pinned ? 'Unfreeze' : 'Freeze'} ${c}">${I.pin}</button>
      </div>
      <span class="th-resize"></span>
    </th>`;
  };
  const body = rows.map(({ row, index }) => `<tr>${cols
    .map(c => cell(row[data.indexOf(c)], c, pkCol, index, data.indexOf(c), offsets))
    .join('')}</tr>`).join('');
  return `<table class="data">
    <thead><tr>${cols.map(th).join('')}</tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function displayValue(v) {
  if (v === null) return 'NULL';
  if (v && v.unsupported) return '<unsupported type>';
  return String(v);
}

function cell(v, col, pkCol, ri, ci, offsets) {
  const editable = pkCol && col !== pkCol;
  const editing = S.editingCell && S.editingCell.ri === ri && S.editingCell.ci === ci;
  const pinned = S.pinned.includes(col);
  const pinAttrs = pinned ? ` style="left:${offsets[col]}px"` : '';
  const pinClass = pinned ? 'pinned' : '';
  if (editing && S.editingCell.phase === 'preview') {
    return `<td class="${pinClass}"${pinAttrs}><div class="cell-diff-inline">
      <span class="cell-diff-old">${displayValue(v)}</span><span style="color:var(--text-faint)">→</span><span class="cell-diff-new">${S.editingCell.draft}</span>
      <button class="cancel" data-act="rollback-cell" title="Rollback">${I.x}</button>
      <button class="save" data-act="commit-cell" title="Commit">${I.check}</button>
    </div></td>`;
  }
  if (editing) {
    // `size` from the value itself: the point of the expansion is to show the
    // whole thing, and a mono face makes `ch` exact.
    const raw = v === null ? '' : (v && v.unsupported ? '' : String(v));
    const size = Math.min(Math.max(raw.length + 1, 12), 60);
    return `<td class="${pinClass}"${pinAttrs}><div class="cell-edit">
      <input value="${raw}" size="${size}" autofocus />
      <button class="save" data-act="preview-cell" title="Preview change">${I.check}</button>
      <button class="cancel" data-act="cancel-cell" title="Cancel">${I.x}</button>
    </div></td>`;
  }
  let inner;
  if (v === null) inner = `<span class="cell-null">NULL</span>`;
  else if (v && v.unsupported) inner = `<span class="cell-unsupported">&lt;unsupported type&gt;</span>`;
  else if (v === true || v === false) inner = `<span class="cell-bool ${v ? 't' : 'f'}">${v}</span>`;
  else if (/^-?\d+$/.test(String(v)) && col !== 'id') inner = `<span class="cell-num">${v}</span>`;
  else inner = v;
  return `<td class="${editable ? 'editable' : ''} ${pinClass}"${pinAttrs} ${editable ? `data-edit-cell="${ri}:${ci}"` : ''}>${inner}</td>`;
}

/* Rendered as directly-appended DOM (like renderMenu), not innerHTML — its
   own onclick handlers, so a click inside the card can stop propagation
   without also breaking this app's document-level delegated click handler. */
function renderConnectionModal() {
  const { mode, id } = S.connectionModal;
  const existing = mode === 'edit' ? CONNECTIONS.find(c => c.id === id) : null;
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.onclick = () => { S.connectionModal = null; render(); };
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.onclick = (e) => e.stopPropagation();
  modal.innerHTML = `
    <div class="modal-head">
      <h3>${mode === 'edit' ? `Edit connection — ${existing.name}` : 'Add a connection'}</h3>
      <button class="ghost-btn icon-only" data-close>${I.x}</button>
    </div>
    <div class="modal-body">${connectionForm(existing)}</div>
    <div class="modal-foot">
      <button class="ghost-btn" style="border:1px solid var(--border)">Test connection</button>
      <div style="display:flex;gap:8px">
        <button class="ghost-btn" data-close>Cancel</button>
        <button class="primary" data-close>Save connection</button>
      </div>
    </div>`;
  scrim.appendChild(modal);
  document.body.appendChild(scrim);
  modal.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { S.connectionModal = null; render(); });
}

/* ---------------------------------------------------------------- render */
function render() {
  document.querySelectorAll('.menu, .scrim, .modal-scrim').forEach(e => e.remove());
  const root = document.getElementById('root');
  root.innerHTML = `${strip()}<div class="body-grid">
    ${S.route === 'settings' ? settingsScreen() : `${sidebar()}<div class="panes"><div class="pane">${dbTab()}</div></div>`}
  </div>`;
  if (S.menu) renderMenu();
  if (S.connectionModal) renderConnectionModal();
  wireDrawerDrag();
}

/* Direct DOM mutation during drag (no render() per mousemove) keeps the
   resize smooth; S.drawerHeight is synced so the next full render agrees. */
function wireDrawerDrag() {
  const handle = document.querySelector('.drawer-handle');
  const drawer = document.querySelector('.query-drawer');
  if (!handle || !drawer) return;
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startY = e.clientY;
    const startH = S.drawerHeight;
    handle.classList.add('dragging');
    function onMove(ev) {
      const dy = startY - ev.clientY;
      S.drawerHeight = Math.min(560, Math.max(120, startH + dy));
      drawer.style.height = S.drawerHeight + 'px';
    }
    function onUp() {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function renderMenu() {
  const { kind, rect } = S.menu;
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.onclick = () => { S.menu = null; render(); };
  const el = document.createElement('div');
  el.className = 'menu';
  if (kind === 'connection') {
    el.innerHTML = `<div class="menu-label">Connection</div>
      ${CONNECTIONS.map(c => `<button class="menu-item" data-pick-connection="${c.id}">
        ${I.plug}<span><strong>${c.name}</strong><span class="desc">${c.host}:${c.port}/${c.database}</span></span>
        ${c.id === S.activeConnectionId ? `<span class="k">${I.check}</span>` : ''}
      </button>`).join('')}
      <div class="menu-sep"></div>
      <button class="menu-item" data-act="settings">${I.gear}<span>Manage connections…</span></button>`;
  }
  document.body.append(scrim, el);
  const top = Math.min(rect.bottom + 6, window.innerHeight - 10);
  const left = Math.min(rect.left, window.innerWidth - el.offsetWidth - 10);
  el.style.top = top + 'px'; el.style.left = left + 'px';
  el.querySelectorAll('[data-pick-connection]').forEach(b => b.onclick = () => {
    S.activeConnectionId = b.dataset.pickConnection; S.menu = null; render();
  });
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { S.route = 'settings'; S.menu = null; render(); });
}

/* ------------------------------------------------------------ listeners */
/* Plain click replaces the sort; shift-click builds one up. A term cycles
   asc -> desc -> gone so a column can be dropped out of a multi-sort without
   clearing the whole thing. */
function applySort(col, additive) {
  const existing = S.sort.find(t => t.col === col);
  if (!additive) {
    S.sort = existing && !existing.desc ? [{ col, desc: true }] : [{ col, desc: false }];
  } else if (!existing) {
    S.sort = [...S.sort, { col, desc: false }];
  } else if (!existing.desc) {
    S.sort = S.sort.map(t => t.col === col ? { col, desc: true } : t);
  } else {
    S.sort = S.sort.filter(t => t.col !== col);
  }
}

/* Removing the column first shifts everything after it left by one, so a
   rightward move has to land AFTER the target to actually go anywhere. */
function moveColumn(col, target) {
  if (col === target) return;
  const cols = visualCols(S.activeTable);
  const from = cols.indexOf(col), to = cols.indexOf(target);
  if (from < 0 || to < 0) return;
  const next = cols.filter(c => c !== col);
  const anchor = next.indexOf(target);
  next.splice(from < to ? anchor + 1 : anchor, 0, col);
  S.colOrder[S.activeTable] = next;
}

document.addEventListener('input', e => {
  if (e.target.id === 'grid-filter') {
    S.filter = e.target.value;
    S.editingCell = null;
    const start = e.target.selectionStart;
    render();
    // Re-focus after the re-render so typing is uninterrupted.
    const next = document.getElementById('grid-filter');
    if (next) { next.focus(); next.setSelectionRange(start, start); }
  }
});

document.addEventListener('dragstart', e => {
  const th = e.target.closest('th[data-col]');
  if (!th) return;
  S.dragCol = th.dataset.col;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', th.dataset.col);
});
document.addEventListener('dragover', e => { if (e.target.closest('th[data-col]')) e.preventDefault(); });
document.addEventListener('drop', e => {
  const th = e.target.closest('th[data-col]');
  if (!th || !S.dragCol) return;
  e.preventDefault();
  moveColumn(S.dragCol, th.dataset.col);
  S.dragCol = null;
  render();
});
document.addEventListener('dragend', () => { if (S.dragCol) { S.dragCol = null; render(); } });

document.addEventListener('click', e => {
  const sortBtn = e.target.closest('[data-sort-col]');
  if (sortBtn) { applySort(sortBtn.dataset.sortCol, e.shiftKey); S.editingCell = null; render(); return; }

  const pinBtn = e.target.closest('[data-pin-col]');
  if (pinBtn) {
    const col = pinBtn.dataset.pinCol;
    S.pinned = S.pinned.includes(col) ? S.pinned.filter(c => c !== col) : [...S.pinned, col];
    S.editingCell = null;
    render(); return;
  }

  const menuBtn = e.target.closest('[data-menu]');
  if (menuBtn) { S.menu = { kind: menuBtn.dataset.menu, rect: menuBtn.getBoundingClientRect() }; render(); return; }

  const table = e.target.closest('[data-table]');
  if (table) {
    S.activeTable = table.dataset.table;
    // A new table's rows and columns are different data — the previous
    // table's sort, filter and frozen columns do not describe them.
    S.editingCell = null; S.sort = []; S.filter = ''; S.pinned = [];
    render(); return;
  }

  const editCell = e.target.closest('[data-edit-cell]');
  if (editCell) { const [ri, ci] = editCell.dataset.editCell.split(':').map(Number); S.editingCell = { ri, ci, phase: 'editing' }; render(); return; }

  const editConn = e.target.closest('[data-edit-connection]');
  if (editConn) { S.connectionModal = { mode: 'edit', id: editConn.dataset.editConnection }; render(); return; }

  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'settings') S.route = 'settings';
    if (a === 'workspace') S.route = 'workspace';
    if (a === 'toggle-console') { S.consoleOpen = !S.consoleOpen; S.queryPhase = 'idle'; }
    if (a === 'run-query') S.queryPhase = 'preview';
    if (a === 'commit-query') S.queryPhase = 'committed';
    if (a === 'rollback-query') S.queryPhase = 'idle';
    if (a === 'ex-select') { S.queryExample = 'select'; S.queryPhase = 'idle'; }
    if (a === 'ex-update') { S.queryExample = 'update'; S.queryPhase = 'idle'; }
    if (a === 'cancel-cell' || a === 'rollback-cell') S.editingCell = null;
    if (a === 'preview-cell') {
      const input = act.closest('.cell-edit').querySelector('input');
      S.editingCell = { ...S.editingCell, phase: 'preview', draft: input.value };
    }
    if (a === 'commit-cell') {
      const { ri, ci, draft } = S.editingCell;
      ROWS[S.activeTable][ri][ci] = draft;
      S.editingCell = null;
    }
    if (a === 'reset-layout') { S.pinned = []; S.colOrder[S.activeTable] = []; }
    if (a === 'add-connection') S.connectionModal = { mode: 'add' };
    render(); return;
  }
});

render();
</script>
</body>
</html>
